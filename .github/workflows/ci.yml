name: CI e controle de environments — EduFlux
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: 'Ambiente a validar'
        required: true
        type: choice
        options: [staging, production]
jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
  staging:
    name: Validar staging (sem deploy externo)
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'staging'
    needs: testes
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo 'Staging validado; prototipo sem hospedagem externa.'
  production:
    name: Aprovar production (sem deploy externo)
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'production'
    needs: testes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo 'Production aprovado; prototipo sem hospedagem externa.'
